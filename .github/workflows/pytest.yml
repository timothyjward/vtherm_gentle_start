name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  pytest:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The manifest depends on Versatile Thermostat: the tests need to find it as a custom integration
      - name: Checkout Versatile Thermostat dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: jmcollin78/versatile_thermostat
          path: versatile_thermostat

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/versatile_thermostat:${{ github.workspace }}
        run: pytest tests/
